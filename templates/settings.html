<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自动扫描设置</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="/static/logo.svg" alt="subsync logo" />
        <div class="brand-copy">
          <h1>自动扫描设置</h1>
          <p>配置自动扫描时间、目录范围、引擎与最近一次执行状态。</p>
        </div>
      </div>
      <nav class="nav-links">
        <a class="button-link secondary" href="/">返回首页</a>
      </nav>
    </header>

    <main class="layout">
      <section class="card stack">
        <p class="muted">媒体根目录：{{ media_root }}</p>
        <p class="muted">数据目录：{{ data_root }}</p>
        <p class="muted">当前时区：{{ timezone_name }}</p>

        <form id="scheduler-form" class="stack">
          <div class="mode-switch">
            <label class="checkbox">
              <input id="scheduler_enabled" type="checkbox" />
              启用自动扫描
            </label>
            <label class="checkbox">
              <input id="scheduler_run_on_startup" type="checkbox" />
              启动时立即扫描一次
            </label>
            <label class="checkbox">
              <input id="scheduler_recursive" type="checkbox" />
              递归扫描子目录
            </label>
          </div>

          <label for="scheduler_scan_time">每天运行时间</label>
          <input id="scheduler_scan_time" type="time" value="03:00" />

          <section class="browser" data-kind="video" data-role="scheduler-dir">
            <div class="browser-head">
              <h2>选择扫描目录</h2>
              <div class="toolbar compact">
                <button type="button" class="secondary refresh-button">刷新</button>
              </div>
            </div>
            <div class="toolbar">
              <input type="text" class="search-input" placeholder="搜索目录" />
              <select class="sort-select">
                <option value="name:asc">名称 A-Z</option>
                <option value="name:desc">名称 Z-A</option>
                <option value="modified:desc">修改时间新到旧</option>
                <option value="modified:asc">修改时间旧到新</option>
                <option value="size:desc">体积大到小</option>
                <option value="size:asc">体积小到大</option>
              </select>
            </div>
            <div class="toolbar compact">
              <button id="add-include-dir" type="button" class="secondary">加入扫描目录</button>
              <button id="add-exclude-dir" type="button" class="secondary">加入排除目录</button>
            </div>
            <div class="breadcrumbs"></div>
            <div class="entries"></div>
            <p class="selected">当前浏览目录：/</p>
          </section>

          <label for="scheduler_include_dirs">扫描目录</label>
          <textarea id="scheduler_include_dirs" rows="4" placeholder="每行一个相对媒体根目录的目录，留空表示扫描整个媒体根目录"></textarea>

          <label for="scheduler_exclude_dirs">排除目录</label>
          <textarea id="scheduler_exclude_dirs" rows="4" placeholder="每行一个相对媒体根目录的目录"></textarea>

          <section class="stack">
            <h2>启用引擎</h2>
            <div class="mode-switch">
              <label class="checkbox">
                <input id="engine_ffsubsync" type="checkbox" value="ffsubsync" />
                ffsubsync
              </label>
              <label class="checkbox">
                <input id="engine_alass" type="checkbox" value="alass" />
                alass
              </label>
              <label class="checkbox">
                <input id="engine_autosubsync" type="checkbox" value="autosubsync" />
                autosubsync
              </label>
            </div>
          </section>

          <details>
            <summary>ffsubsync 参数</summary>
            <div class="advanced-grid">
              <label class="checkbox">
                <input id="scheduler_ffsubsync_use_embedded_subtitles" type="checkbox" />
                使用视频中的内嵌字幕
              </label>
              <label class="checkbox">
                <input id="scheduler_no_fix_framerate" type="checkbox" />
                不自动修正帧率不匹配
              </label>
              <label class="checkbox">
                <input id="scheduler_gss" type="checkbox" />
                启用 GSS 搜索最佳帧率比例
              </label>
              <label for="scheduler_ffsubsync_vad">语音活动检测器</label>
              <select id="scheduler_ffsubsync_vad">
                <option value="default">默认</option>
                <option value="subs_then_webrtc">subs_then_webrtc</option>
                <option value="subs_then_auditok">subs_then_auditok</option>
                <option value="subs_then_silero">subs_then_silero</option>
                <option value="webrtc">webrtc</option>
                <option value="auditok">auditok</option>
                <option value="silero">silero</option>
              </select>
            </div>
          </details>

          <details>
            <summary>alass 参数</summary>
            <div class="advanced-grid">
              <label class="checkbox">
                <input id="scheduler_alass_use_embedded_subtitles" type="checkbox" />
                使用视频中的内嵌字幕
              </label>
              <label class="checkbox">
                <input id="scheduler_alass_disable_fps_guessing" type="checkbox" />
                禁用 FPS 猜测
              </label>
              <label class="checkbox">
                <input id="scheduler_alass_disable_speed_optimization" type="checkbox" />
                禁用速度优化
              </label>
              <label for="scheduler_alass_split_penalty">分割惩罚</label>
              <input id="scheduler_alass_split_penalty" type="range" min="-1" max="1000" value="7" />
              <output id="scheduler_alass_split_penalty_value">7</output>
            </div>
          </details>

          <details>
            <summary>autosubsync 参数</summary>
            <div class="advanced-grid">
              <label class="checkbox">
                <input id="scheduler_autosubsync_use_embedded_subtitles" type="checkbox" />
                使用视频中的内嵌字幕
              </label>
              <label for="scheduler_autosubsync_max_shift_secs">最大位移（秒）</label>
              <input id="scheduler_autosubsync_max_shift_secs" type="range" min="1" max="120" value="20" />
              <output id="scheduler_autosubsync_max_shift_secs_value">20</output>
              <label for="scheduler_autosubsync_parallelism">并行度</label>
              <input id="scheduler_autosubsync_parallelism" type="range" min="1" max="16" value="3" />
              <output id="scheduler_autosubsync_parallelism_value">3</output>
            </div>
          </details>

          <div class="task-actions">
            <button id="scheduler-save-button" type="submit">保存扫描设置</button>
            <button id="scheduler-run-now-button" type="button" class="secondary">立即扫描一次</button>
          </div>
          <div id="scheduler-form-error" class="alert hidden"></div>
          <div id="scheduler-form-success" class="alert hidden success-text"></div>
        </form>
      </section>

      <section class="card stack">
        <h2>最近状态</h2>
        <div class="status-row">
          <span>当前状态</span>
          <strong id="scheduler-status-label">-</strong>
        </div>
        <div class="status-row">
          <span>开始时间</span>
          <code id="scheduler-last-started">-</code>
        </div>
        <div class="status-row">
          <span>结束时间</span>
          <code id="scheduler-last-finished">-</code>
        </div>
        <div class="status-row">
          <span>摘要</span>
          <code id="scheduler-last-summary">-</code>
        </div>
        <div class="status-row">
          <span>错误</span>
          <code id="scheduler-last-error">-</code>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
