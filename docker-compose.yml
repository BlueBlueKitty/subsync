services:
  subsync:
    build: .
    container_name: subsync
    ports:
      - "1314:1314"
    environment:
      PORT: "1314"
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_ROOT: /media
      DATA_ROOT: /data
      MAX_CONCURRENT_TASKS: "1"
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/media
      - ${DATA_HOST_PATH:-./data}:/data
    restart: unless-stopped
